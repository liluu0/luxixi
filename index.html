<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0d0e0d">
    <title>LUXIXI / 露西西</title>
    <style>
      html,body{margin:0;background:#0d0e0d;color:#f1efe7}
      #startup{box-sizing:border-box;min-height:100svh;padding:24px max(16px,6vw);font:13px/1.8 monospace;background:#0d0e0d;background-image:linear-gradient(#262a2533 1px,transparent 1px),linear-gradient(90deg,#262a2533 1px,transparent 1px);background-size:80px 80px;color:#f1efe7}
      #startup{display:grid;place-items:center;padding:24px;overflow:hidden}
      #startup:before{content:"";position:absolute;width:min(72vw,720px);height:min(72vw,720px);border:1px solid #d8ff3618;border-radius:50%;box-shadow:0 0 0 42px #d8ff3605,0 0 0 43px #ff78b710;animation:startup-orbit 18s linear infinite}
      #startup .startup-loader{width:min(500px,88vw);text-align:center;position:relative;z-index:1}
      #startup .startup-brand{color:#d8ff36;font:bold 22px/1 Arial,sans-serif;letter-spacing:-.08em;display:inline-block;transform:rotate(-3deg);text-shadow:4px 4px 0 #6057ff}
      #startup .startup-mark{width:118px;height:118px;margin:42px auto 32px;border:1px solid #d8ff3655;border-radius:47% 53% 52% 48%;display:grid;place-items:center;position:relative;background:#d8ff3608;box-shadow:12px 14px 0 #ff78b733;transform:rotate(7deg);animation:startup-wobble 3s ease-in-out infinite}
      #startup .startup-mark:before{content:"";width:66px;height:66px;border:1px solid #ff78b766;border-top-color:#d8ff36;border-radius:50%;animation:startup-spin 1.4s linear infinite}
      #startup .startup-mark:after{content:"✳";position:absolute;color:#d8ff36;font-size:24px;animation:startup-pulse 1.4s ease-in-out infinite}
      #startup .startup-mark i{position:absolute;width:9px;height:9px;background:#ff694f;border-radius:50%;right:4px;top:14px;box-shadow:22px 35px 0 #a9bfff;animation:startup-dots 2.2s ease-in-out infinite}
      #startup .startup-label{font:bold 10px/1 monospace;letter-spacing:.2em;color:#a5a89f;margin:0 0 18px}
      #startup-status{margin:0 auto;color:#d8ff36!important;font:10px/1.5 monospace;letter-spacing:.08em}
      #startup .startup-track{height:8px;margin:25px auto 0;background:#d8ff3617;border:1px solid #d8ff3630;transform:rotate(-1deg);padding:2px;overflow:hidden;box-shadow:5px 5px 0 #6057ff55}
      #startup .startup-track i{display:block;width:34%;height:100%;background:linear-gradient(90deg,#d8ff36,#ff78b7);animation:startup-progress 1.8s ease-in-out infinite}
      #startup .startup-foot{margin-top:42px;color:#65736c;font:9px/1.6 monospace;letter-spacing:.12em}
      #startup .startup-foot:before{content:"✦ ";color:#ff78b7}#startup .startup-foot:after{content:" ✦";color:#a9bfff}
      @keyframes startup-spin{to{transform:rotate(360deg)}}
      @keyframes startup-progress{0%{transform:translateX(-130%)}55%,100%{transform:translateX(330%)}}
      @keyframes startup-pulse{50%{opacity:.35;transform:scale(.8)}}
      @keyframes startup-wobble{50%{transform:rotate(-5deg) translateY(-5px)}}
      @keyframes startup-dots{50%{transform:translate(-8px,7px)}}
      @keyframes startup-orbit{to{transform:rotate(360deg)}}
      @media(max-width:700px){#startup{padding:18px}#startup:before{width:110vw;height:110vw}.startup-mark{margin-top:34px!important;width:94px!important;height:94px!important}.startup-mark:before{width:52px!important;height:52px!important}.startup-foot{margin-top:32px!important;font-size:8px!important}}
      @media(prefers-reduced-motion:reduce){#startup:before,#startup .startup-mark,#startup .startup-mark:before,#startup .startup-mark:after,#startup .startup-mark i,#startup .startup-track i{animation:none}}
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Visible from HTML alone; no scripts, fonts or images required. -->
      <main id="startup" aria-label="露西西个人作品集">
        <div class="startup-loader">
          <div class="startup-brand">LUXIXI ✳</div>
          <div class="startup-mark" aria-hidden="true"><i></i></div>
          <p class="startup-label">PREPARING INTERACTIVE WORKS</p>
          <p id="startup-status" role="status">正在准备互动内容…</p>
          <div class="startup-track" aria-hidden="true"><i></i></div>
          <p class="startup-foot">MOTION / 3D / INTERACTION</p>
          <noscript>请启用 JavaScript 以浏览互动作品。</noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
